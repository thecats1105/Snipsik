name: Deploy to GCP VM

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: japsik-507607
  WIF_PROVIDER: projects/992944582728/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-actions@japsik-507607.iam.gserviceaccount.com
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: snipsik
  IMAGE_NAME: snipsik
  VM_NAME: snipsik
  VM_ZONE: us-central1-a
  VM_USER: thecats1105
  CONTAINER_NAME: snipsik-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Check if image already exists in Artifact Registry
        id: check-image
        run: |
          TARGET_IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          if gcloud artifacts docker images describe "$TARGET_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $TARGET_IMAGE already exists in Artifact Registry. Skipping build and push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image $TARGET_IMAGE does not exist. Proceeding with build and push."
          fi

      - name: Configure Docker authentication for Artifact Registry
        if: steps.check-image.outputs.exists != 'true'
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build and push Docker image
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare environment file
        env:
          APP_ENV: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$APP_ENV" ]; then
            echo "Error: ENV_FILE secret is not configured in GitHub repository secrets!" >&2
            exit 1
          fi
          echo "$APP_ENV" > .env.prod
          chmod 600 .env.prod

      - name: Deploy container to GCP VM via gcloud compute ssh
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "==> Ensuring deployment directory exists on VM..."
          gcloud compute ssh ${{ env.VM_USER }}@${{ env.VM_NAME }} \
            --zone=${{ env.VM_ZONE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet \
            --command="mkdir -p ~/snipsik && rm -f ~/snipsik/.env"

          echo "==> Uploading environment file and deployment script..."
          gcloud compute scp .env.prod ${{ env.VM_USER }}@${{ env.VM_NAME }}:~/snipsik/.env \
            --zone=${{ env.VM_ZONE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet

          gcloud compute scp scripts/deploy.sh ${{ env.VM_USER }}@${{ env.VM_NAME }}:~/snipsik/deploy.sh \
            --zone=${{ env.VM_ZONE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet

          echo "==> Executing deployment script on VM..."
          gcloud compute ssh ${{ env.VM_USER }}@${{ env.VM_NAME }} \
            --zone=${{ env.VM_ZONE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --quiet \
            --command="bash ~/snipsik/deploy.sh '$IMAGE_URI' '${{ env.CONTAINER_NAME }}' '${{ env.GAR_LOCATION }}' '~/snipsik/.env'"

      - name: Clean up temporary files on runner
        if: always()
        run: |
          rm -f .env.prod
